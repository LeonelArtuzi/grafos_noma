<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coleta de lixo sob a ótica dos grafos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="deck"><div id="stage"></div></div>
<nav id="bar" aria-label="Navegação dos slides">
<button id="prev" aria-label="Slide anterior">&#8249;</button><span id="count" aria-live="polite"></span><button id="next" aria-label="Próximo slide">&#8250;</button>
<button id="nt" aria-pressed="false" title="Notas do apresentador (N)">Notas</button><button id="fs" title="Tela cheia (F)">Tela cheia</button>
</nav>
<div id="notesPanel" role="region" aria-label="Notas do apresentador"><div class="nh"><span>Notas do apresentador</span><button id="ntClose" type="button">Fechar notas (N)</button></div><div id="notesText" aria-live="polite"></div></div>
<script src="app.js"></script>
</body>
</html>
